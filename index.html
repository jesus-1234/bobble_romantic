<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bubble Shooter Romántico</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background: linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
    touch-action:none;
    font-family:Arial, Helvetica, sans-serif;
}

canvas{ display:block; }

#message{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:0 0 10px pink;
}

#finalBox{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    display:none;
    animation:fadeIn .5s ease;
}

#finalBox button{
    margin:10px;
    padding:10px 20px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#yes{background:#ff4da6;color:white;}
#no{background:#999;color:white;}

@keyframes fadeIn{
    from{opacity:0; transform:translate(-50%,-40%);}
    to{opacity:1; transform:translate(-50%,-50%);}
}
</style>
</head>
<body>

<div id="message"></div>

<div id="finalBox">
    <h2>¿Quieres estar conmigo? 💖</h2>
    <button id="yes">Sí 💘</button>
    <button id="no">No 🙈</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const radius = 18;
const diameter = radius * 2;
const colors = ["#ff4da6","#4dd2ff","#ffd24d"];

let rows = 6;
let cols;
let offsetX;
let grid = [];

function calculateCols(){
    cols = Math.floor(window.innerWidth / diameter);
    offsetX = (window.innerWidth - (cols * diameter)) / 2;
}
calculateCols();

function createGrid(){
    grid = [];
    for(let r=0;r<rows;r++){
        grid[r]=[];
        for(let c=0;c<cols;c++){
            grid[r][c]={
                x: offsetX + c*diameter + radius,
                y: r*diameter + radius,
                color: colors[Math.floor(Math.random()*3)]
            }
        }
    }
}
createGrid();

let shooter={
    x:window.innerWidth/2,
    y:window.innerHeight-60,
    color:colors[Math.floor(Math.random()*3)]
};

let currentBubble=null;
let direction=0;

function drawBubble(x,y,color){
    if(!color) return;
    ctx.beginPath();
    ctx.arc(x,y,radius,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
}

function drawGrid(){
    for(let r=0;r<grid.length;r++){
        for(let c=0;c<cols;c++){
            let b = grid[r][c];
            if(b){
                drawBubble(b.x,b.y,b.color);
            }
        }
    }
}

function drawShooter(){
    shooter.x = window.innerWidth/2;
    shooter.y = window.innerHeight-60;
    drawBubble(shooter.x,shooter.y,shooter.color);
}

function shoot(){
    if(currentBubble) return;
    currentBubble={
        x:shooter.x,
        y:shooter.y,
        color:shooter.color,
        dx:Math.cos(direction)*6,
        dy:Math.sin(direction)*6
    };
    shooter.color=colors[Math.floor(Math.random()*3)];
}

function update(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGrid();
    drawShooter();

    if(currentBubble){
        currentBubble.x+=currentBubble.dx;
        currentBubble.y+=currentBubble.dy;

        if(currentBubble.x <= radius || currentBubble.x >= window.innerWidth - radius){
            currentBubble.dx*=-1;
        }

        if(currentBubble.y <= radius){
            explode();
        }

        drawBubble(currentBubble.x,currentBubble.y,currentBubble.color);
    }

    requestAnimationFrame(update);
}

function explode(){
    document.getElementById("message").innerText="💥 ¡Boom! Te quiero mucho 💖";
    setTimeout(()=>{ document.getElementById("message").innerText=""; },1000);

    currentBubble=null;

    if(grid.length>0){
        grid.pop();
    }

    removeFloatingBubbles();

    if(grid.length===0){
        setTimeout(()=>{
            document.getElementById("finalBox").style.display="block";
        },800);
    }
}

function removeFloatingBubbles(){
    let connected = new Set();
    let stack = [];

    for(let c=0;c<cols;c++){
        if(grid[0] && grid[0][c]){
            stack.push({r:0,c:c});
        }
    }

    while(stack.length>0){
        let {r,c} = stack.pop();
        let key = r+"-"+c;
        if(connected.has(key)) continue;
        connected.add(key);

        let neighbors = [
            {r:r-1,c:c},
            {r:r+1,c:c},
            {r:r,c:c-1},
            {r:r,c:c+1}
        ];

        for(let n of neighbors){
            if(grid[n.r] && grid[n.r][n.c]){
                stack.push(n);
            }
        }
    }

    for(let r=0;r<grid.length;r++){
        for(let c=0;c<cols;c++){
            if(grid[r][c]){
                let key = r+"-"+c;
                if(!connected.has(key)){
                    grid[r][c]=null;
                }
            }
        }
    }
}

canvas.addEventListener("touchmove",e=>{
    let touch=e.touches[0];
    let dx=touch.clientX - shooter.x;
    let dy=touch.clientY - shooter.y;
    direction=Math.atan2(dy,dx);
});

canvas.addEventListener("touchstart",shoot);

canvas.addEventListener("mousemove",e=>{
    let dx=e.clientX - shooter.x;
    let dy=e.clientY - shooter.y;
    direction=Math.atan2(dy,dx);
});

canvas.addEventListener("click",shoot);

update();
</script>

</body>
</html>
